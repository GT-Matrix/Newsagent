[project]
name = "newsagent"
version = "0.1.0"
description = "AI news ingest, classification, scoring, verification, and daily report pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.12",
  "flask>=3.0.0",
  "requests>=2.34.2",
]

[project.scripts]
modnews-pipeline = "modnews_pipeline.cli:main"
modnews-classify-snapshot = "modnews_pipeline.classify.cli:main"
modnews-progress = "modnews_pipeline.web:main"
newsagent-report = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "modnews_pipeline"]
